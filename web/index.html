<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KhoaVeyon</title>
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
<link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/01-base.css">
<link rel="stylesheet" href="/css/02-components.css">
<link rel="stylesheet" href="/css/03-pages.css">
<link rel="stylesheet" href="/css/04-log-dialogs.css">
<link rel="stylesheet" href="/css/05-violations.css">
<link rel="stylesheet" href="/css/06-status-auto.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><img src="/assets/icon.svg" alt="KhoaVeyon"></div>
      <div><b>KhoaVeyon</b><small id="verTxt">Quản lý lớp học</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="verbox"><span class="vtxt">Phiên bản <b id="verNum">…</b></span><button class="updbtn" id="sideUpd" data-act="checkupd" title="Kiểm tra phiên bản mới trên GitHub">⟳ <span>Kiểm tra cập nhật</span></button></div>
      <div class="status" id="status" title=""><span class="dot" id="statusDot"></span><span id="statusTxt">Đang kiểm tra...</span></div>
      <button class="quit" id="quitBtn">⏻ <span>Thoát chương trình</span></button>
    </div>
  </aside>

  <div id="topbar"><i></i></div>
  <main class="main" id="main">
    <header class="top">
      <div><h1 id="title"></h1><p id="sub"></p></div>
      <div class="row" style="gap:10px"><span class="badge clsbadge hidden" id="classBadge" title="Bấm để mở Lớp và lịch dạy"></span><button class="btn ghost" id="lockBtn" title="Khóa màn hình (nhập mật khẩu để mở lại)">🔒 Khóa</button><span class="pill hidden" id="busy"><i class="spin"></i><span id="busyText">Đang thực hiện...</span><span class="pbar" id="busyBar"></span></span></div>
    </header>
    <div id="updbar" class="note hidden" style="margin-bottom:18px"></div>
    <div id="view"></div>
  </main>
</div>

<section class="logdock" id="logdock">
  <div class="loghead" id="loghead">
    <span>📋</span><b>Nhật ký</b><span class="muted" id="logcount"></span><span class="sp"></span>
    <button id="logClear">Xóa</button><button id="logToggle">Thu gọn ▾</button>
  </div>
  <div class="logbody" id="logbody"></div>
</section>
<div id="toasts"></div>
<div id="modalroot"></div>

<script>const TOKEN = '__TOKEN__';</script>
<script src="/js/01-core.js"></script>
<script src="/js/02-setup.js"></script>
<script src="/js/03-control.js"></script>
<script src="/js/04-lists.js"></script>
<script src="/js/05-distribution.js"></script>
<script src="/js/06-settings.js"></script>
<script src="/js/07-vcfg.js"></script>
<script src="/js/08-violations.js"></script>
<script src="/js/09-attendance.js"></script>
<script src="/js/10-seats.js"></script>
<script src="/js/11-school.js"></script>
<script src="/js/12-report.js"></script>
<script src="/js/13-app.js"></script>
<script src="/js/14-status.js"></script>
<script src="/js/15-auto.js"></script>
<script src="/js/16-exam.js"></script>
<script src="/js/17-khoalink.js"></script>
<script src="/js/18-applock.js"></script>
<script src="/js/19-tools.js"></script>
<script src="/js/20-interact.js"></script>
<script src="/js/21-engage.js"></script>
<script src="/js/22-monitor.js"></script>
<script src="/js/23-fun.js"></script>
<script src="/js/99-boot.js"></script>
</body>
</html>
