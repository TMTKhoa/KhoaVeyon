<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KhoaVeyon</title>
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
<link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --line:#e5e9f2; --text:#1b2437; --muted:#6b778c;
  --primary:#2563eb; --primary-d:#1d4ed8; --primary-l:#e8effe;
  --ok:#16a34a; --ok-l:#e8f7ee; --warn:#ea580c; --warn-l:#fff1e6; --err:#dc2626; --err-l:#fdecec;
  --side:#0f1b33; --side-2:#16264a; --side-text:#c5d0e6;
  --radius:14px; --shadow:0 1px 2px rgba(15,27,51,.06),0 6px 20px rgba(15,27,51,.05);
  --side-w:250px; --log-h:230px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14.5px;color:var(--text);background:var(--bg);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}

/* ---------- bố cục ---------- */
.app{display:flex;height:100%}
.side{width:var(--side-w);background:linear-gradient(180deg,var(--side),var(--side-2));color:var(--side-text);display:flex;flex-direction:column;padding:18px 14px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 22px}
.brand .logo{width:46px;height:46px;border-radius:12px;box-shadow:0 6px 16px rgba(0,242,254,.25);flex-shrink:0}
.brand .logo img{width:100%;height:100%;display:block;border-radius:12px}
.brand b{display:block;color:#fff;font-size:18px;letter-spacing:.2px}
.brand small{color:#8fa1c4;font-size:12px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav .grp{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#6f83ab;padding:14px 12px 6px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:10px;padding:11px 12px;color:var(--side-text);cursor:pointer;text-align:left;transition:.15s}
.nav button .ic{width:24px;text-align:center;font-size:17px}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.35)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.status{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.06);cursor:pointer}
.dot{width:9px;height:9px;border-radius:50%;background:#64748b;flex-shrink:0}
.dot.ok{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.dot.bad{background:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.25)}
.quit{background:rgba(255,255,255,.08);border:0;color:#dbe4f5;border-radius:10px;padding:10px;cursor:pointer}
.quit:hover{background:rgba(220,38,38,.85);color:#fff}

.main{flex:1;min-width:0;overflow:auto;padding:26px 32px calc(var(--log-h) + 40px)}
.main.logclosed{padding-bottom:90px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
.top h1{margin:0;font-size:26px;letter-spacing:-.2px}
.top p{margin:6px 0 0;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--primary-l);color:var(--primary-d);padding:7px 14px;border-radius:99px;font-weight:600;font-size:13px}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid #93b4fb;border-top-color:var(--primary);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pill{position:relative;overflow:hidden}
.pill .pbar{position:absolute;left:0;bottom:0;height:3px;background:var(--primary);width:0;transition:width .3s}
#topbar{position:fixed;left:0;top:0;right:0;height:3px;z-index:9999;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .2s}
#topbar.on{opacity:1}
#topbar i{display:block;height:100%;width:35%;background:var(--primary);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{margin-left:-35%}to{margin-left:100%}}
body.waiting,body.waiting *{cursor:progress}

/* ---------- thẻ, nút ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card h3{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:10px}
.card .sub{margin:-8px 0 14px;color:var(--muted);font-size:13.5px}
.stack{display:flex;flex-direction:column;gap:18px}
.clsbadge{cursor:pointer;font-size:13px;padding:4px 12px}.clsbadge.off{background:#eef1f6;color:#6b7a99}
.sgrid{border-collapse:separate;border-spacing:4px;width:100%}.sgrid th{font-size:12px;color:var(--muted);font-weight:700;text-align:center;padding:4px}.sgrid td{background:#f3f6fb;border-radius:8px;text-align:center;padding:9px 4px;font-weight:700;min-width:64px}.sgrid td.tm{background:none;color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap}.sgrid td.on{background:var(--primary);color:#fff}.sgrid td.nil{background:none;border:0;padding:0}
.room{background:linear-gradient(180deg,#f7f9fd,#eef2f9);border:1px solid var(--line);border-radius:18px;padding:22px 18px 18px;overflow:auto}
.room .inner{width:max-content;margin:0 auto}
.frontrow{display:flex;gap:12px;margin-bottom:14px}.frontrow>div{flex:1;display:flex;flex-direction:column;gap:6px;align-items:center}
.tdesk{width:100%;text-align:center;background:#dfe6f4;border-radius:12px;padding:9px;font-weight:700;font-size:13px;color:#46557a;box-shadow:inset 0 -3px 0 #c9d3e8}
.tdoor2{width:100%;text-align:center;background:#e1f3e8;border-radius:12px;padding:9px;font-weight:700;font-size:13px;color:#2f6b4a}
.tdoor{margin:16px auto 0;width:200px;text-align:center;border-top:4px solid #9db0d6;padding-top:6px;font-size:12px;color:var(--muted)}
.dayhead{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.04em}
.seats{display:grid;column-gap:22px;row-gap:10px;justify-content:center}
.seat{position:relative;width:132px;height:84px;border:1.5px solid #cfd8ea;border-radius:12px;background:#fff;padding:8px 8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:.12s;box-shadow:0 1px 2px rgba(15,27,51,.05)}
.seat:hover{border-color:var(--primary);transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.15)}
.seat .sn{position:absolute;top:5px;left:5px;min-width:22px;height:22px;border-radius:7px;background:#e6ebf5;color:#51607f;font-size:11.5px;font-weight:700;line-height:22px;font-style:normal;text-align:center;padding:0 4px}
.seat .av{width:30px;height:30px;border-radius:50%;background:#e6ebf5;color:#51607f;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;margin-top:2px}
.seat .nm{font-size:12.5px;font-weight:700;line-height:1.15;text-align:center;max-width:116px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--text)}
.seat .tg{position:absolute;top:5px;right:5px;font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;font-style:normal}
.seat.empty{border-style:dashed;background:transparent}.seat.empty .av{background:transparent;border:1.5px dashed #b9c4dc;color:#98a5c0;font-size:16px}.seat.empty .nm{color:#98a5c0;font-weight:600}
.seat.full{background:#eaf1ff;border-color:#a9c3f7}.seat.full .sn{background:#cfe0ff;color:var(--primary-d)}.seat.full .av{background:var(--primary);color:#fff}
.seat.guest{background:#fff6e5;border-color:#f2cf8e}.seat.guest .av{background:#f59e0b;color:#fff}.seat.guest .sn{background:#fde8bf;color:#b45309}
.seat.absent{background:#f2f3f6;border-style:dashed;border-color:#cfd3dd}.seat.absent .av{background:#d5d9e3;color:#fff}.seat.absent .nm{text-decoration:line-through;color:#8a92a6}.seat.absent .tg{background:#e1e4ec;color:#6b7387}
.seat.moved{background:#e7f7ed;border-color:#8fd0a8;box-shadow:0 0 0 3px rgba(22,163,74,.12)}.seat.moved .av{background:var(--ok);color:#fff}.seat.moved .sn{background:#c8ecd5;color:#1f7a45}.seat.moved .tg{background:var(--ok);color:#fff}
.seat.shared{box-shadow:0 0 0 3px rgba(234,88,12,.15);border-color:#f5a672}.seat.shared .tg{background:var(--warn);color:#fff}
.seat.bad{background:repeating-linear-gradient(135deg,#fdecec,#fdecec 8px,#fbe0e0 8px,#fbe0e0 16px);border-color:#f0a8a8}.seat.bad .av{background:var(--err);color:#fff}.seat.bad .nm{color:#b91c1c}.seat.bad .sn{background:#f8c9c9;color:#b91c1c}
.seat.off::after{content:'';position:absolute;bottom:6px;right:7px;width:9px;height:9px;border-radius:50%;background:#f59e0b;box-shadow:0 0 0 2px #fff}
.sstats{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sstat{background:#f1f4fa;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:#46557a}.sstat b{color:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin:12px 0 0;justify-content:center}.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px;border:1.5px solid}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 16px;margin-bottom:14px;padding:14px;background:#f7f9fd;border:1px solid var(--line);border-radius:12px}
.lgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}.lgrid input,.lgrid select{width:100%;padding:8px 10px;border:1px solid #d3dae8;border-radius:10px;font:inherit;background:#fff}
.achips{display:flex;flex-wrap:wrap;gap:6px}.achip{border:1px solid #d3dae8;background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:600}.achip:hover{border-color:var(--primary)}.achip.ab{background:#fde8e8;border-color:#f3b4b4;color:#b91c1c;text-decoration:line-through}
.cchips{display:flex;flex-wrap:wrap;gap:8px}.cchip{border:1px solid #d3dae8;background:#fff;border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:700}.cchip small{color:var(--muted);font-weight:500;margin-left:6px}.cchip:hover{border-color:var(--primary)}.cchip.on{background:var(--primary-l);border-color:var(--primary);color:var(--primary-d)}
.badge{background:var(--primary-l);color:var(--primary-d);border-radius:99px;font-size:12px;font-weight:700;padding:2px 10px}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;background:#e9edf5;color:var(--text);transition:.15s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:#dde3ef}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.28)}
.btn.primary:hover{background:var(--primary-d)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--err);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--primary);cursor:pointer;padding:0;font-weight:600}
.link:hover{text-decoration:underline}
input[type=text],input[type=search],select,textarea{width:100%;border:1px solid #d3dae8;border-radius:10px;padding:10px 12px;background:#fff;outline:none;transition:.15s}
input[type=text]:focus,input[type=search]:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
textarea{min-height:170px;font-family:Consolas,monospace;font-size:13.5px}
label.field{display:block;font-weight:600;margin:0 0 6px}
.hint{color:var(--muted);font-size:13px;line-height:1.5}
.note{background:var(--primary-l);color:#1e3a8a;border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.5}
.note.warn{background:var(--warn-l);color:#9a3412}

/* toggle */
.switch{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch .tr{width:44px;height:25px;border-radius:99px;background:#cbd3e1;position:relative;transition:.2s;flex-shrink:0}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.switch input:checked + .tr{background:var(--primary)}
.switch input:checked + .tr::after{left:22px}

/* ---------- Điều khiển lớp ---------- */
.grid-control{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
.addhost{display:flex;gap:8px;margin-bottom:12px}
.hosttools{display:flex;align-items:center;gap:14px;margin:6px 0 10px;font-size:13px}
.hostlist{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.hostlist li{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fbfcfe}
.hostlist li.sel{border-color:var(--primary);background:var(--primary-l)}
.hostlist label{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;font-weight:600}
.hostlist input{width:17px;height:17px;accent-color:var(--primary)}
.x{background:none;border:0;color:#94a3b8;font-size:20px;line-height:1;cursor:pointer;border-radius:6px;padding:2px 8px}
.x:hover{background:var(--err-l);color:var(--err)}
.empty{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:#f8fafc;border-radius:12px;padding:13px 14px;cursor:pointer;transition:.15s;font-weight:600}
.tile .ico{font-size:22px;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08);flex-shrink:0}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(15,27,51,.1)}
.tile.lock{background:var(--warn-l);border-color:#fed7b8}
.tile.lock:hover{border-color:var(--warn)}
.tile.free{background:var(--ok-l);border-color:#bfe6cc}
.tile.free:hover{border-color:var(--ok)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- Danh sách ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1;min-width:200px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px dashed #b8c4dc;background:#fff;border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer;font-weight:600;color:var(--primary-d)}
.chip:hover{background:var(--primary-l);border-style:solid}
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{position:sticky;top:-26px;z-index:2;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);background:#f8fafd;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl th:first-child{border-top-left-radius:10px}.tbl th:last-child{border-top-right-radius:10px}
.tbl td{padding:6px 8px;border-bottom:1px solid #eef1f7;vertical-align:middle}
.tbl tr:hover td{background:#fafcff}
.tbl td.num{width:44px;color:#9aa6bd;text-align:center;font-size:13px}
.tbl td.act{width:150px;white-space:nowrap;text-align:right}
.cell{border:1px solid transparent!important;background:transparent!important;padding:8px 10px!important}
.cell:hover{border-color:#d3dae8!important}
.cell:focus{background:#fff!important}
.iconbtn{background:none;border:0;border-radius:8px;width:30px;height:30px;cursor:pointer;color:#7a879f;font-size:15px}
.iconbtn:hover{background:#eaeff8;color:var(--text)}
.iconbtn.del:hover{background:var(--err-l);color:var(--err)}
.warnmark{display:inline-block;color:var(--warn);cursor:help;font-size:16px;margin-right:4px}
.savebar{position:sticky;bottom:-26px;margin-top:18px;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 -6px 22px rgba(15,27,51,.08);flex-wrap:wrap}
.savebar .grow{flex:1;min-width:220px}
.dirty{color:var(--warn);font-weight:700}

/* ---------- Phân phối ---------- */
.steps{display:flex;flex-direction:column;gap:18px;max-width:980px}
.stepno{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:inline-grid;place-items:center;font-size:14px;font-weight:700}
.files{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fbfcfe}
.file input{width:17px;height:17px;accent-color:var(--primary)}
.file .nm{flex:1;font-weight:600;word-break:break-all}
.file .sz{color:var(--muted);font-size:12.5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.radiocards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rc{border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:#fff;transition:.15s}
.rc:hover{border-color:#b8c8ee}
.rc.on{border-color:var(--primary);background:var(--primary-l)}
.rc b{display:block;margin-bottom:4px}
.rc span{color:var(--muted);font-size:13px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.formgrid .full{grid-column:1/-1}

/* ---------- nhật ký ---------- */
.logdock{position:fixed;left:var(--side-w);right:0;bottom:0;height:var(--log-h);background:#0d1424;color:#d6deef;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(10,16,32,.28);z-index:20;border-top:1px solid #1d2a47}
.logdock.closed{height:46px}
.loghead{display:flex;align-items:center;gap:12px;padding:0 18px;height:46px;flex-shrink:0;cursor:pointer;user-select:none}
.loghead b{font-size:14px}
.loghead .sp{flex:1}
.loghead button{background:rgba(255,255,255,.1);border:0;color:#cbd5ea;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:12.5px}
.loghead button:hover{background:rgba(255,255,255,.2)}
.logbody{flex:1;overflow:auto;padding:4px 18px 12px;font-family:Consolas,"Cascadia Mono",monospace;font-size:13px;line-height:1.55}
.ln{white-space:pre-wrap;word-break:break-word}
.ln .t{color:#5f6f93;margin-right:10px}
.ln.ok{color:#86efac}.ln.err{color:#fca5a5}.ln.head{color:#93c5fd;font-weight:700}.ln.warn{color:#fcd34d}

/* ---------- hộp thoại, thông báo ---------- */
.modalbg{position:fixed;inset:0;background:rgba(10,16,32,.5);display:grid;place-items:center;z-index:50;animation:fade .15s}
.modalbox{background:#fff;border-radius:16px;width:min(560px,92vw);max-height:90vh;overflow:auto;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:pop .18s}
.modalbox h3{margin:0 0 12px;font-size:19px}
.modalbox .body{line-height:1.6;margin-bottom:20px}
.modalbox .btns{display:flex;justify-content:flex-end;gap:10px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(10px) scale(.97);opacity:0}}
#toasts{position:fixed;top:18px;right:18px;display:flex;flex-direction:column;gap:10px;z-index:60}
.toast{background:#1b2437;color:#fff;border-radius:12px;padding:13px 18px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:420px;animation:pop .2s;display:flex;gap:10px;line-height:1.45}
.toast.ok{background:#15803d}.toast.err{background:#b91c1c}.toast.warn{background:#c2410c}
.nbadge{margin-left:auto;background:#ef4444;color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:1px 8px;min-width:20px;text-align:center}
.nav button.alerting .ic{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.toast.alert{background:#b91c1c;align-items:flex-start;cursor:pointer;width:420px;padding:12px 14px;border:2px solid #fecaca}
.toast.alert img{width:132px;height:80px;object-fit:cover;border-radius:8px;background:#000;flex-shrink:0}
.toast.alert .tt{flex:1;min-width:0}
.toast.alert b{display:block;font-size:15px;margin-bottom:2px}
.toast.alert .sm{opacity:.9;font-size:12.5px;word-break:break-word}
.toast.alert .xx{background:none;border:0;color:#fff;font-size:18px;cursor:pointer;line-height:1;padding:0 2px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}

<body>
<div class="app">
  <aside class="side">

      <div class="logo"><img src="/assets/icon.svg" alt="KhoaVeyon"></div>

    </div>

    <div class="side-foot">

      <button class="quit" id="quitBtn">⏻ <span>Thoát chương trình</span></button>
    </div>
  </aside>

  <div id="topbar"><i></i></div>
  <main class="main" id="main">
    <header class="top">
      <div><h1 id="title"></h1><p id="sub"></p></div>
      <div class="row" style="gap:10px"><span class="badge clsbadge hidden" id="classBadge" title="Bấm để mở Lớp và lịch dạy"></span><span class="pill hidden" id="busy"><i class="spin"></i><span id="busyText">Đang thực hiện...</span><span class="pbar" id="busyBar"></span></span></div>
    </header>
    <div id="updbar" class="note hidden" style="margin-bottom:18px"></div>
    <div id="view"></div>
  </main>
</div>

<section class="logdock" id="logdock">
  <div class="loghead" id="loghead">
    <span>📋</span><b>Nhật ký</b><span class="muted" id="logcount"></span><span class="sp"></span>
    <button id="logClear">Xóa</button><button id="logToggle">Thu gọn ▾</button>
  </div>
  <div class="logbody" id="logbody"></div>
</section>
<div id="toasts"></div>
<div id="modalroot"></div>

<script>
const TOKEN = '__TOKEN__';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const QUIET = ['/api/log', '/api/alerts', '/api/ping'];   // các lệnh hỏi ngầm, không hiện "đang tải"
const L = {inflight: 0, pending: 0, jobs: [], serverBusy: false, since: 0, timer: null};
function updBusy() {
  const on = L.inflight > 0 || L.pending > 0 || L.serverBusy;
  const el = $('#busy'); if (!el) return;
  el.classList.toggle('hidden', !on);
  $('#topbar').classList.toggle('on', on);
  document.body.classList.toggle('waiting', on);
  let text = 'Đang thực hiện...', pct = 0;
  if (L.jobs.length) {
    const j = L.jobs[0], more = L.jobs.length > 1 ? ` (+${L.jobs.length - 1} việc)` : '';
    text = `${j.title}: ${j.done}/${j.total} máy${j.err ? `, ${j.err} lỗi` : ''}${more}`;
    pct = j.total ? Math.round(100 * j.done / j.total) : 0;
  } else if (L.inflight > 0) text = 'Đang xử lý, vui lòng chờ...';
  else if (L.pending > 0) text = 'Đang gửi lệnh...';
  $('#busyText').textContent = text;
  $('#busyBar').style.width = pct + '%';
}
function pollSoon() { clearTimeout(L.timer); L.timer = setTimeout(pollLog, 250); }
async function api(path, body) {
  const quiet = QUIET.some(q => path.startsWith(q));
  const init = {method: body === undefined ? 'GET' : 'POST', headers: {'X-Token': TOKEN}};
  if (body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(body); }
  let r;
  if (!quiet) { L.inflight++; updBusy(); }
  try {
    try { r = await fetch(path, init); } catch (e) { throw new Error('Mất kết nối với chương trình. Hãy mở lại bằng Chay-KhoaVeyon.bat'); }
    const data = await r.json().catch(() => ({error: 'Phản hồi không hợp lệ'}));
    if (!r.ok || data.error) throw new Error(data.error || ('Lỗi ' + r.status));
    return data;
  } finally {
    if (!quiet) { L.inflight--; updBusy(); }
  }
}

const PAGES = [
  {id:'setup', ic:'🚀', name:'Thiết lập ban đầu', title:'Thiết lập ban đầu', sub:'Một nút để chuẩn bị mọi thứ cần thiết trước khi dùng lần đầu.'},
  {id:'control', ic:'🎛️', name:'Điều khiển lớp', title:'Điều khiển lớp học', sub:'Chọn máy học sinh rồi bấm một nút để khóa máy, chặn web hoặc chặn ứng dụng.'},
  {id:'school', ic:'📅', name:'Lớp & lịch dạy', title:'Lớp và lịch dạy', sub:'Nhập danh sách lớp và thời khóa biểu để chương trình tự biết đang dạy lớp nào và ghi tên lớp vào từng vi phạm.'},
  {id:'viol', ic:'🚨', name:'Vi phạm', title:'Vi phạm của học sinh', sub:'Ảnh và thông tin vi phạm tự động gửi về từ các máy học sinh đang được giám sát.'},
  {id:'report', ic:'📊', name:'Báo cáo', title:'Báo cáo vi phạm', sub:'Thống kê cuối buổi: máy nào, trang nào vi phạm nhiều nhất.'},
  {id:'vcfg', ic:'🛠️', name:'Cấu hình Veyon', title:'Cấu hình Veyon', sub:'Sao lưu, so sánh, khôi phục và đẩy cấu hình xuống máy học sinh, thêm máy vào Veyon Master.'},
  {id:'dist', ic:'📦', name:'Phân phối & chạy', title:'Phân phối và chạy ứng dụng', sub:'Chép file sang máy học sinh rồi chạy ứng dụng chỉ với một nút bấm.'},
  {grp:'Danh sách'},
  {id:'keep', ic:'✅', name:'Ứng dụng được phép', list:'keep'},
  {id:'allow', ic:'🌐', name:'Trang web được phép', list:'allow'},
  {id:'block', ic:'⛔', name:'Ứng dụng bị chặn', list:'block'},
  {grp:'Hệ thống'},
  {id:'settings', ic:'⚙️', name:'Cài đặt', title:'Cài đặt', sub:'Đường dẫn, mẫu lệnh Veyon và tên các mục điều khiển.'},
];

const S = {setup:null, st:null, hosts:[], sel:new Set(), page:'control', lists:{}, payload:[], logSeq:0, logOpen:true, busy:false,
  school:null, att:null, layOpen:false, schoolBrief:null, seatCls:'', stu:{}, violCls:'', report:null, reportRange:'today', groupToasts:{}, alerts:[], alertSeq:0, alertInit:false, unseen:0, watching:0, violHost:''};

/* ---------- tiện ích giao diện ---------- */
function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), kind === 'err' ? 7000 : 3800);
}

function modal({title, html, ok = 'Đồng ý', cancel = 'Hủy', danger = false, collect = null, noCancel = false, third = null}) {
  return new Promise(resolve => {
    const root = $('#modalroot');
    root.innerHTML = `<div class="modalbg"><div class="modalbox" role="dialog"><h3>${esc(title)}</h3><div class="body">${html}</div>
      <div class="btns">${noCancel ? '' : `<button class="btn" data-m="cancel">${esc(cancel)}</button>`}${third ? `<button class="btn ghost" data-m="third">${esc(third.label)}</button>` : ''}<button class="btn ${danger ? 'danger' : 'primary'}" data-m="ok">${esc(ok)}</button></div></div></div>`;
    const done = v => { root.innerHTML = ''; document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') done(null); };
    document.addEventListener('keydown', onKey);
    root.querySelector('[data-m=ok]').onclick = () => done(collect ? collect(root) : true);
    const c = root.querySelector('[data-m=cancel]'); if (c) c.onclick = () => done(null);
    const t3 = root.querySelector('[data-m=third]'); if (t3) t3.onclick = () => done(third.value);
    root.querySelector('.modalbg').addEventListener('mousedown', e => { if (e.target.classList.contains('modalbg')) done(null); });
    const f = root.querySelector('textarea,input'); if (f) f.focus(); else root.querySelector('[data-m=ok]').focus();
  });
}

/* ---------- máy học sinh ---------- */
async function saveHosts() { try { await api('/api/hosts', {hosts: S.hosts}); } catch (e) { toast(e.message, 'err'); } }

function addHosts(text) {
  let n = 0;
  for (const h of String(text).split(/[,\s;]+/)) {
    if (h && !S.hosts.includes(h)) { S.hosts.push(h); S.sel.add(h); n++; }
  }
  if (n) saveHosts();
  return n;
}

function targets() {
  const sel = S.hosts.filter(h => S.sel.has(h));
  return sel.length ? {hosts: sel, all: false} : {hosts: S.hosts.slice(), all: true};
}

async function resolveTargets() {
  if (!S.hosts.length) { toast('Hãy thêm máy học sinh trước ở trang "Điều khiển lớp".', 'warn'); return null; }
  const t = targets();
  if (t.all) {
    const ok = await modal({title: 'Áp dụng cho tất cả máy?', html: `Chưa chọn máy nào. Áp dụng cho <b>tất cả ${t.hosts.length} máy</b>?`, ok: 'Áp dụng cho tất cả'});
    if (!ok) return null;
  }
  return t.hosts;
}

function action(key) { return S.st.actions.find(a => a.key === key); }

async function confirmRisky(a, n) {
  if (!a.confirm) return true;
  return !!(await modal({title: 'Xác nhận', danger: true, ok: 'Tiếp tục',
    html: `<b>${esc(a.label)}</b> trên ${n} máy.<br>Ứng dụng đang mở của học sinh có thể bị đóng, bài chưa lưu sẽ mất.`}));
}

async function runAction(key) {
  const a = action(key);
  const hosts = await resolveTargets(); if (!hosts) return;
  if (!(await confirmRisky(a, hosts.length))) return;
  try {
    toast(`Đang gửi lệnh "${a.label}" tới ${hosts.length} máy...`);
    await api('/api/run', {key, hosts}); openLog();
    L.pending++; updBusy(); pollSoon();            // hiện "đang chạy" ngay, không chờ lần hỏi tiếp theo
    setTimeout(() => { L.pending = Math.max(0, L.pending - 1); updBusy(); }, 4000);
  }
  catch (e) { toast(e.message, 'err'); }
}


/* ---------- trang: Thiết lập ban đầu ---------- */
async function loadSetup() { S.setup = await api('/api/setup_status'); }

function viewSetup() {
  const u = S.setup, c = S.st.cfg;
  const row = (ok, title, desc, btn) => `<div class="file" style="align-items:flex-start;gap:14px">
    <span style="font-size:20px;line-height:1.3">${ok === true ? '✅' : ok === false ? '⚠️' : '⏳'}</span>
    <div class="nm" style="font-weight:600">${title}<div class="hint" style="font-weight:400">${desc}</div></div>${btn || ''}</div>`;
  const b = (act, text, extra = '') => `<button class="btn sm" data-act="${act}" ${extra}>${text}</button>`;
  const itemsOk = u.items_have === u.items_total;
  const scriptOk = u.script_in_payload || u.script_found;
  return `<div class="steps">
    <section class="card">
      <h3>Thiết lập máy giáo viên</h3>
      <p class="sub">Tạo sẵn 3 file danh sách mẫu (không ghi đè file có sẵn), tạo file thiết lập cho máy học sinh và tự thêm ${u.items_total} mục điều khiển vào Veyon. Không động tới máy học sinh.</p>
      <div class="row"><button class="btn primary" data-act="setupall">🚀 Thiết lập máy giáo viên</button>
        <button class="btn" data-act="scan">🔎 Tìm máy học sinh trong mạng</button>
        ${u.done ? '<span class="badge" style="background:var(--ok-l);color:var(--ok)">Đã thiết lập</span>' : ''}</div>
      ${u.windows ? '' : '<div class="note warn" style="margin-top:12px">Bạn đang không chạy trên Windows nên các bước Veyon, chép file và schtasks chỉ chạy được trên máy giáo viên Windows.</div>'}
    </section>
    <section class="card">
      <h3>Trạng thái từng bước</h3>
      <div class="files">
        ${row(u.cli, 'Tìm thấy veyon-cli', u.cli ? esc(u.cli_path) : 'Chưa thấy. Cài Veyon (Master) trên máy này hoặc đặt đường dẫn ở trang Cài đặt.', u.cli ? '' : b('gosettings', 'Mở Cài đặt'))}
        ${row(itemsOk, `Mục điều khiển trong Veyon (${u.items_have}/${u.items_total})`, itemsOk ? 'Đã đủ. Các nút ở trang Điều khiển lớp dùng được.' : (u.items_err ? 'Chưa đọc được: ' + esc(u.items_err) : 'Chưa đủ. Bấm tạo tự động, Windows sẽ hỏi quyền quản trị' + (u.admin ? '' : ' (hộp thoại UAC)') + '.'), b('setupveyon', itemsOk ? 'Cập nhật lại' : 'Tạo mục trong Veyon'))}
        ${row((u.auth_names || []).length ? true : null, 'Khóa xác thực Veyon', (u.auth_names || []).length ? 'Đang dùng cặp khóa có sẵn: <b>' + esc(u.auth_names.join(', ')) + '</b>. Bấm để chép khóa public xuống các máy học sinh (máy đã có đúng khóa thì bỏ qua).' : 'Chưa thấy cặp khóa nào. Bấm để tự tạo cặp khóa rồi chép khóa public xuống các máy học sinh.', b('setupkeys', 'Chép khóa xuống máy học sinh'))}
        ${row(u.lists_ok === u.lists_total, `Danh sách Excel (${u.lists_ok}/${u.lists_total} file)`, 'Tạo file mẫu (Chrome, ONLYOFFICE, Paint cho ứng dụng được phép; vài trang học tập; game phổ biến để chặn). Không ghi đè file đã có.', u.lists_ok === u.lists_total ? '' : b('setuplists', 'Tạo file mẫu'))}
        ${row(scriptOk, esc(u.script_name) + ' để gửi cho máy học sinh', scriptOk ? (u.script_in_payload ? 'Đã có trong thư mục payload.' : 'Tìm thấy trên máy này, sẽ tự chép vào payload.') : 'Chưa tìm thấy. Thêm file này vào thư mục payload (trang Phân phối &amp; chạy, nút Thêm file).', b('setuppayload', 'Chuẩn bị file'))}
        ${row(u.student_bat, 'Setup-MayHocSinh.bat cho máy học sinh', 'Chạy <b>một lần</b> trên mỗi máy học sinh bằng quyền quản trị: tạo C:\\cmd, mở tường lửa chia sẻ file và Task Scheduler từ xa, bật Veyon Service. Sau bước này mọi thứ còn lại làm từ máy giáo viên.', b('openpayload', 'Mở thư mục payload'))}
        ${row(u.hosts > 0, `Danh sách máy học sinh (${u.hosts} máy)`, u.hosts ? 'Có thể thêm bớt ở trang Điều khiển lớp.' : 'Bấm "Tìm máy học sinh trong mạng" (tìm máy đang mở cổng Veyon) hoặc nhập thủ công.', '')}
      </div>
      <div class="row" style="margin-top:14px"><button class="btn ghost" data-act="refreshsetup">↻ Làm mới trạng thái</button></div>
    </section>
    <section class="card">
      <h3>Thiết lập máy học sinh</h3>
      <p class="sub">Áp dụng cho <b>${targets().all ? 'tất cả ' + targets().hosts.length : targets().hosts.length}</b> máy ${targets().all ? '(chưa tick máy nào ở Điều khiển lớp)' : 'đã tick'}. Máy nào đã thiết lập đủ thì được bỏ qua, nên bấm lại nhiều lần không sao.</p>

      <label class="switch" style="margin-top:12px"><input type="checkbox" data-cfg="auto_lock" ${S.st.cfg.auto_lock ? 'checked' : ''}><span class="tr"></span><span>Tự khóa C:\\cmd sau khi thiết lập máy học sinh</span></label>
      <p class="hint">Khóa: học sinh chỉ đọc và chạy được trong <code>C:\\cmd</code>, giáo viên vẫn chép và sửa file bằng quyền quản trị, thư mục <code>log</code> vẫn cho ghi để nhật ký hoạt động chạy tiếp. Mở khóa trả quyền về mặc định.</p>
      <p class="hint">Mỗi máy được kiểm tra Veyon Service, chia sẻ C$, Task Scheduler từ xa, script và dịch vụ. Máy thiếu thì tự chép file vào <code>C:\\cmd</code> và chạy <code>-install</code>. Máy chưa mở được chia sẻ (máy mới chưa từng cấu hình) cần chạy <code>Setup-MayHocSinh.bat</code> một lần bằng quyền quản trị, kết quả từng máy xem ở Nhật ký.</p>
    </section>
  </div>`;
}

async function refreshSetup() { try { await loadSetup(); if (S.page === 'setup') render(); } catch (e) { toast(e.message, 'err'); } }

async function setupStep(step, needHosts) {
  let hosts = [];
  if (needHosts) { hosts = await resolveTargets(); if (!hosts) return; }
  else hosts = targets().hosts;
  try {
    await api('/api/setup_run', {step, hosts});
    openLog();
    if (step === 'all') toast('Đang thiết lập máy giáo viên. Nếu Windows hỏi quyền quản trị, bấm Yes.', 'ok');
    setTimeout(refreshSetup, step === 'all' || step === 'veyon' ? 6000 : 700);
    if (step === 'all' || step === 'veyon') setTimeout(refreshSetup, 20000);
  } catch (e) { toast(e.message, 'err'); }
}

async function scanHosts() {
  toast('Đang quét mạng, mất vài giây...', '');
  try {

function warnHtml(w) { return w ? `<span class="warnmark" title="${esc(w)}">⚠</span>` : ''; }

function markDirty(kind) {
  S.lists[kind].dirty = true;
  const el = $('#dirtyTxt'); if (el) el.innerHTML = '<span class="dirty">● Có thay đổi chưa lưu</span>';
}

let checkTimer = null;
function scheduleCheck(kind) {
  clearTimeout(checkTimer);
  checkTimer = setTimeout(async () => {
    try {
      const L = S.lists[kind];
      const r = await api('/api/check', {kind, rows: L.rows.map(x => [x.a, x.b])});
      L.warn = Object.fromEntries(r.warnings.map(w => [w.row, w.msg]));
      document.querySelectorAll('.warnslot').forEach(el => { el.innerHTML = warnHtml(L.warn[el.dataset.i]); });
    } catch (e) { /* bỏ qua */ }
  }, 350);
}

function applyFilter(kind) {
  const L = S.lists[kind], q = L.filter.trim().toLowerCase();
  document.querySelectorAll('#rows tr').forEach(tr => {
    const r = L.rows[tr.dataset.i];
    tr.classList.toggle('hidden', !!q && !((r.a + ' ' + r.b).toLowerCase().includes(q)));
  });
}

function addRows(kind, items) {
  const L = S.lists[kind], have = new Set(L.rows.map(r => r.a.toLowerCase()));
  let n = 0;
  for (const [a, b] of items) {
    if (a && !have.has(a.toLowerCase())) { L.rows.push({a, b: b || ''}); have.add(a.toLowerCase()); n++; }
  }
  if (n) { markDirty(kind); scheduleCheck(kind); }
  return n;
}

async function saveList(kind, apply) {
  const L = S.lists[kind], m = S.st.lists[kind];
  let hosts;
  if (apply) {
    hosts = await resolveTargets(); if (!hosts) return;
    if (!(await confirmRisky(action(m.apply), hosts.length))) return;
  } else {
    hosts = targets().hosts;
  }
  try {
    const r = await api('/api/list', {kind, rows: L.rows.map(x => [x.a.trim(), x.b.trim()]), hosts, apply: !!apply});
    L.rows = L.rows.filter(x => x.a.trim()).map(x => ({a: x.a.trim(), b: x.b.trim()}));
    L.warn = Object.fromEntries(r.warnings.map(w => [w.row, w.msg]));
    L.dirty = false; L.exists = true;
    let msg = `Đã lưu ${r.count} dòng`;
    if (r.pushed) msg += `, đang gửi xuống ${r.pushed} máy`;
    if (r.applied) msg += `, đang áp dụng lệnh`;
    toast(msg, 'ok');
    if (r.warnings.length) toast(`${r.warnings.length} dòng có thể bị script bỏ qua (xem dấu ⚠)`, 'warn');
    if (r.pushed || r.applied) openLog();
    render();
  } catch (e) { toast(e.message, 'err'); }
}

async function loadPayload() { S.payload = (await api('/api/payload')).items; }

async function saveCfg(part) {
  try { await api('/api/settings', part); Object.assign(S.st.cfg, part); }
  catch (e) { toast(e.message, 'err'); }
}

async function runDist(copy, run) {
  const c = S.st.cfg;
  const hosts = await resolveTargets(); if (!hosts) return;
  const skip = new Set(c.dist_payload_skip || []);
  const payload = S.payload.filter(f => !skip.has(f.name)).map(f => f.name);
  const mode = c.dist_mode;
  if (run && mode === 'none') { toast('Hãy chọn cách chạy ở bước 2.', 'warn'); return; }
  const steps = [];
  if (copy) steps.push(`chép file sang <b>${esc(c.dist_target)}</b>`);
  if (run && mode === 'schtasks') steps.push(`chạy lệnh <code>${esc(c.dist_cmd)}</code>`);
  if (run && mode === 'veyon') steps.push(`kích hoạt mục Veyon "<b>${esc(action(c.dist_action).label)}</b>"`);
  const ok = await modal({title: 'Xác nhận', ok: 'Thực hiện', html: `Trên <b>${hosts.length}</b> máy sẽ:<ul style="margin:8px 0 0;padding-left:20px"><li>${steps.join('</li><li>')}</li></ul>`});
  if (!ok) return;
  try {
    await api('/api/dist', {copy, run, mode, hosts, include_lists: c.dist_include_lists, payload, extra: c.dist_files || [],
      target: c.dist_target, cmd: c.dist_cmd, action: c.dist_action, interactive: c.dist_interactive});
    toast('Đã bắt đầu, xem kết quả từng máy ở Nhật ký', 'ok'); openLog();
  } catch (e) { toast(e.message, 'err'); }
}

async function uploadFiles(files) {
  for (const f of files) {
    try {
      const r = await fetch('/api/upload?name=' + encodeURIComponent(f.name), {method: 'PUT', headers: {'X-Token': TOKEN}, body: f});
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Lỗi tải lên');
      toast('Đã thêm ' + f.name, 'ok');
    } catch (e) { toast(f.name + ': ' + e.message, 'err'); }
  }
  await loadPayload(); render();
}

async function saveSettings() {
  const part = {features: {}};
  document.querySelectorAll('[data-set]').forEach(el => { part[el.dataset.set] = el.type === 'checkbox' ? el.checked : el.value; });
  document.querySelectorAll('[data-feat]').forEach(el => { part.features[el.dataset.feat] = el.value; });
  try {
    await api('/api/settings', part);
    S.st = await api('/api/state');
    S.lists = {};
    toast('Đã lưu cài đặt', 'ok'); render(true);
  } catch (e) { toast(e.message, 'err'); }
}


function showUpdate() {
  const bar = $('#updbar'), u = S.st.update;
  if (!u || !u.newer) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  bar.innerHTML = `🔔 Có bản mới <b>${esc(u.latest)}</b> (đang dùng ${esc(u.current)}). <button class="btn primary sm" data-act="applyupd" style="margin-left:10px">Cập nhật ngay</button> <button class="link" data-act="notesupd" style="margin-left:8px">Xem thay đổi</button>`;
}

async function checkUpdate() {
  try {
    await saveSettings();
    const u = await api('/api/update_check');
    S.st.update = u; showUpdate();
    toast(u.newer ? `Có bản mới ${u.latest}` : `Đang dùng bản mới nhất (${u.current})`, u.newer ? 'warn' : 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

/* hộp thoại hỏi khi GitHub có bản mới: hỏi một lần cho mỗi bản, "Để sau" thì hỏi lại sau 4 giờ, "Bỏ qua" thì không hỏi nữa */
let updAsking = false;
async function maybeAskUpdate(u) {
  if (!u || u.skipped || !u.can_apply || updAsking) return;
  if (S.updAsked && S.updAsked.v === u.latest && Date.now() - S.updAsked.t < 4 * 3600 * 1000) return;
  if ($('#modalroot').innerHTML || S.busy) return;           // đang mở hộp thoại khác hoặc đang chạy lệnh: để lần sau
  updAsking = true;
  try {
    S.st.update = Object.assign({}, S.st.update, {newer: true, latest: u.latest, current: u.current, notes: u.notes, page: u.page}); showUpdate();
    const warn = S.watching ? `<div class="note warn" style="margin:10px 0 0">Đang giám sát ${S.watching} máy. Chương trình sẽ khởi động lại trong vài giây, phần giám sát trên máy học sinh vẫn chạy, ảnh vi phạm sẽ được nhận lại sau khi mở lại.</div>` : '';
    const r = await modal({title: `Có bản mới ${u.latest}`, ok: 'Cập nhật ngay', cancel: 'Để sau', third: {label: 'Bỏ qua bản này', value: 'skip'},
      html: `<p style="margin-top:0">KhoaVeyon trên GitHub của bạn vừa có bản <b>${esc(u.latest)}</b> (đang dùng ${esc(u.current)}). Bạn có muốn cập nhật không?</p>
        ${u.notes ? `<div class="muted" style="margin-bottom:4px">Thay đổi:</div><div style="white-space:pre-wrap;max-height:34vh;overflow:auto;background:#f3f6fb;border-radius:10px;padding:10px 12px;font-size:13px">${esc(u.notes)}</div>` : ''}
        <p class="hint" style="margin-bottom:0">Danh sách, lớp, sơ đồ chỗ ngồi và cài đặt của bạn được giữ nguyên. Bản cũ được sao lưu trước khi thay.</p>${warn}`});
    S.updAsked = {v: u.latest, t: Date.now()};
    if (r === 'skip') { await saveCfg({update_skip: u.latest}); toast('Sẽ không hỏi lại bản ' + u.latest + ' (có bản mới hơn thì hỏi tiếp)', 'ok'); }
    else if (r) {
      try { await api('/api/update_apply', {}); openLog(); toast('Đang cập nhật, cửa sổ mới sẽ tự mở sau vài giây', 'ok'); } catch (e) { toast(e.message, 'err'); }
    }
  } finally { updAsking = false; }
}

async function applyUpdate() {
  const u = S.st.update;
  if (!(await modal({title: 'Cập nhật lên ' + u.latest + '?', ok: 'Cập nhật', html: 'Chương trình sẽ tải bản mới, thay file chương trình (bản cũ được sao lưu trong data\\backup-' + esc(u.current) + ') rồi tự khởi động lại. Không mất cài đặt và danh sách.'}))) return;
  try {
    await api('/api/update_apply', {});
    openLog(); toast('Đang cập nhật, cửa sổ mới sẽ tự mở sau vài giây', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

function vcCollect() {
  const q = k => document.querySelector(`[data-vc="${k}"]`);
  const v = S.vcfg;
  if (q('restart')) v.restart = q('restart').checked;
  if (q('cli')) v.client_cli = q('cli').value;
  if (q('loc')) v.location = q('loc').value;
  return {push: v.push, restart: v.restart, location: v.location, client_cli: v.client_cli};
}

async function vcRun(body, okMsg) {
  try { await api('/api/vcfg_run', body); openLog(); toast(okMsg, 'ok'); setTimeout(() => go('vcfg'), 4000); }
  catch (e) { toast(e.message, 'err'); }
}

async function vcAction(act, el) {
  const v = S.vcfg;
  if (act === 'vc_addrow') { vcCollect(); v.push.push({key: '', value: ''}); render(); return; }
  if (act === 'vc_delrow') { vcCollect(); v.push.splice(+el.dataset.i, 1); render(); return; }
  if (act === 'vc_savepush') { try { await api('/api/vcfg_save', vcCollect()); toast('Đã lưu', 'ok'); } catch (e) { toast(e.message, 'err'); } return; }
  if (act === 'vc_netobj_scan') return vcRun({step: 'netobj_scan'}, 'Đang dò nhóm, kết quả ở Nhật ký');
  if (act === 'vc_backup_master') return vcRun({step: 'backup_master'}, 'Đang sao lưu cấu hình master');
  if (act === 'vc_compare') { if (!S.vcA || !S.vcB) { toast('Chọn hai bên để so sánh', 'warn'); return; } return vcRun({step: 'compare', a: S.vcA, b: S.vcB}, 'Đang so sánh, kết quả ở Nhật ký'); }
  const hosts = await resolveTargets(); if (!hosts) return;
  if (act === 'vc_backup_clients') return vcRun({step: 'backup_clients', hosts}, `Đang sao lưu ${hosts.length} máy`);
  if (act === 'vc_restore_master' || act === 'vc_restore_clients') {
    if (!S.vcF) { toast('Chọn file sao lưu để khôi phục', 'warn'); return; }
    const m = act === 'vc_restore_master';
    if (!(await modal({title: 'Khôi phục cấu hình Veyon?', danger: true, ok: 'Khôi phục', html: `File <b>${esc(S.vcF)}</b> sẽ <b>thay toàn bộ</b> cấu hình Veyon của ${m ? 'máy master (cần quyền quản trị)' : hosts.length + ' máy học sinh, Veyon Service sẽ khởi động lại'}. Cấu hình hiện tại được lưu trước.`}))) return;
    return vcRun({step: m ? 'restore_master' : 'restore_clients', file: S.vcF, hosts: m ? [] : hosts}, 'Đang khôi phục');
  }
  if (act === 'vc_push') {
    const c = vcCollect();
    if (!(await modal({title: 'Đẩy cấu hình xuống máy học sinh?', ok: 'Đẩy', html: `Ghi ${c.push.filter(r => r.key.trim()).length} khóa vào ${hosts.length} máy${c.restart ? ', rồi khởi động lại Veyon Service' : ''}.`}))) return;
    try { await api('/api/vcfg_save', c); } catch (e) { toast(e.message, 'err'); return; }
    return vcRun({step: 'push', hosts, push: c.push, restart: c.restart}, 'Đang đẩy cấu hình');
  }
  if (act === 'vc_netobj') { const c = vcCollect(); try { await api('/api/vcfg_save', c); } catch (e) { toast(e.message, 'err'); return; } return vcRun({step: 'netobj', hosts, location: c.location}, 'Đang thêm máy vào Veyon Master. Nếu Windows hỏi quyền quản trị, bấm Yes.'); }
}

document.addEventListener('input', e => {
  const t = e.target; if (!S.vcfg) return;
  if (t.dataset && t.dataset.vk !== undefined) S.vcfg.push[+t.dataset.vk].key = t.value;
  else if (t.dataset && t.dataset.vv !== undefined) S.vcfg.push[+t.dataset.vv].value = t.value;
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset || t.dataset.vc === undefined) return;
  if (t.dataset.vc === 'a') S.vcA = t.value;
  else if (t.dataset.vc === 'b') S.vcB = t.value;
  else if (t.dataset.vc === 'f') S.vcF = t.value;
  else if (t.dataset.vc === 'preset' && t.value !== '') {
    const p = S.vcfg.presets[+t.value]; vcCollect();
    if (!S.vcfg.push.some(r => r.key === p.key)) S.vcfg.push.push({key: p.key, value: p.value});
    render();
  }
});

const imgUrl = e => e.img ? '/evidence/' + e.img.split('/').map(encodeURIComponent).join('/') + '?t=' + encodeURIComponent(TOKEN) : '';
const kindLabel = e => e.type === 'site' ? 'Trang web' : 'Ứng dụng';

function updWatchInfo() {
  const el = $('#watchInfo'); if (!el) return;
  el.textContent = S.watching ? `Đang nhận cảnh báo từ ${S.watching} máy` : 'Chưa bật giám sát';
}

function alertGap() { return Math.max(10, +S.st.cfg.alert_group_sec || 60); }
function fillAlertToast(g) {
  const e = g.last, n = g.count, secs = Math.round(g.last.ts - g.first.ts);
  const title = n > 1 ? `${esc(e.host)} vi phạm liên tục` : `${esc(e.host)} vừa vi phạm`;
  const more = n > 1 ? `<span class="cnt">${n} ảnh</span>` : '';
  const dur = n > 1 ? `<div class="sm">${n} ảnh trong ${secs < 60 ? secs + ' giây' : Math.round(secs / 60) + ' phút'}, mới nhất lúc ${esc(e.time)}</div>` : `<div class="sm">${esc(e.date)} ${esc(e.time)}${e.user ? ' · ' + esc(e.user) : ''}${e.window ? '<br>' + esc(e.window) : ''}</div>`;
  g.el.innerHTML = `${e.img ? `<img src="${imgUrl(e)}" alt="">` : ''}<div class="tt"><b>🚨 ${title}${more}</b>${esc(e.text)}${dur}</div><button class="xx" title="Đóng">×</button>`;
  g.el.querySelector('.xx').onclick = ev => { ev.stopPropagation(); g.el.remove(); };
}
function showAlert(e) {
  const key = e.host + '|' + e.type + '|' + e.name, gap = alertGap();
  let g = S.groupToasts[key];
  if (g && document.body.contains(g.el) && e.ts - g.last.ts <= gap) {   // cùng máy, cùng trang: cập nhật thông báo cũ, không tạo cái mới
    g.count++; g.last = e; fillAlertToast(g);
    clearTimeout(g.timer); g.timer = setTimeout(() => g.el.remove(), 20000);
    return;
  }
  const box = $('#toasts');
  const olds = [...box.querySelectorAll('.toast.alert')];
  while (olds.length >= 4) olds.shift().remove();
  const el = document.createElement('div');
  el.className = 'toast alert';
  g = S.groupToasts[key] = {el, count: 1, first: e, last: e, timer: null};
  fillAlertToast(g);
  el.onclick = ev => { if (!ev.target.closest('.xx')) go('viol'); el.remove(); };
  box.appendChild(el);
  g.timer = setTimeout(() => el.remove(), 20000);
}

let titleTimer = null;
function flashTitle(text) {
  clearInterval(titleTimer);
  let n = 0;
  titleTimer = setInterval(() => {
    document.title = (n++ % 2) ? 'KhoaVeyon' : '🚨 ' + text;

async function pollAlerts() {
  try {
    const r = await api('/api/alerts?since=' + S.alertSeq);
    S.watching = r.watching; updWatchInfo(); S.schoolBrief = r.school; updClassBadge(); maybeAskUpdate(r.update);
    if (!S.alertInit) {                       // lần đầu: nạp lịch sử, không báo động lại việc cũ
      S.alerts = r.items; S.alertSeq = r.last; S.seenSeq = r.last; S.freshFrom = r.last; S.alertInit = true; return;
    }
    if (!r.items.length) return;
    S.alertSeq = r.last;
    S.alerts = S.alerts.concat(r.items).slice(-500);
    if (S.st.cfg.alert_popup !== false) r.items.slice(-30).forEach(showAlert);
    flashTitle(`${r.items[r.items.length - 1].host} vi phạm`);
    if (S.page === 'viol') { S.seenSeq = S.alertSeq; render(); } else { S.unseen += r.items.length; buildNav(); }
  } catch (e) { /* mất kết nối tạm thời */ }
}

function groupAlerts(list, gap) {
  const out = [], last = {};
  for (const e of list) {
    const k = e.host + '|' + e.type + '|' + e.name, g = last[k];
    if (g && e.ts - g.lastTs <= gap) { g.items.push(e); g.lastTs = e.ts; }
    else { const ng = {host: e.host, type: e.type, name: e.name, text: e.text, items: [e], firstTs: e.ts, lastTs: e.ts}; out.push(ng); last[k] = ng; }
  }
  return out.sort((a, b) => b.lastTs - a.lastTs);
}

/* ---------- sơ đồ chỗ ngồi ---------- */
const LAY_DEFAULT = {cols: 4, per: 10, from: 'teacher', first: 'left', pattern: '', seats: {}, broken: [], gv: 'center', door: 'back'};
function curLay() { return Object.assign({}, LAY_DEFAULT, (S.school.layouts || {})[S.seatCls] || {}); }

/* số máy ở từng ô: hàng 0 gần bàn giáo viên, hàng cuối gần cửa; đánh số theo từng dãy */
function seatNumbers(lay) {
  const cols = +lay.cols, per = +lay.per, num = Array.from({length: per}, () => Array(cols).fill(0));
  const order = [...Array(cols).keys()]; if (lay.first === 'right') order.reverse();
  let n = 0;
  for (const c of order) {
    const rows = [...Array(per).keys()]; if (lay.from === 'door') rows.reverse();
    for (const r of rows) num[r][c] = ++n;
  }
  return num;
}

async function seatSave(patch, all) {
  const lay = Object.assign(curLay(), patch);
  for (const k of ['cols', 'per']) lay[k] = Math.max(1, Math.min(k === 'cols' ? 12 : 20, parseInt(lay[k]) || 1));
  try { S.school = await api('/api/school_layout', Object.assign({cls: S.seatCls, apply_all: !!all}, lay)); } catch (err) { toast(err.message, 'err'); }
  render();
}

async function seatNames() {
  if (!S.stu[S.seatCls]) S.stu[S.seatCls] = (await api('/api/school_students?cls=' + encodeURIComponent(S.seatCls))).names;
  return S.stu[S.seatCls];
}

async function seatAuto() {
  const names = await seatNames(), lay = curLay(), seats = {}, bad = new Set(lay.broken || []);
  const slots = [...Array(lay.cols * lay.per).keys()].map(i => i + 1).filter(n => !bad.has(n)), total = slots.length;
  names.slice(0, total).forEach((n, i) => { seats[slots[i]] = n; });
  if (Object.keys(lay.seats).length && !(await modal({title: 'Xếp lại từ đầu?', html: 'Chỗ ngồi hiện tại của lớp này sẽ được thay bằng thứ tự trong danh sách lớp (học sinh số 1 ngồi máy 1...), bỏ qua các máy hỏng.', ok: 'Xếp lại'}))) return;
  if (names.length > total) toast(`Lớp có ${names.length} học sinh nhưng chỉ có ${total} máy dùng được, ${names.length - total} em chưa có chỗ`, 'warn');
  await seatSave({seats});
}

async function seatPick(n) {
  const names = await seatNames(), lay = curLay(), seats = Object.assign({}, lay.seats), cur = seats[n] || '';
  const isBad = (lay.broken || []).includes(n), inList = names.includes(cur);
  const used = {}; Object.values(seats).forEach(v => { used[v] = (used[v] || 0) + 1; });
  const free = names.filter(x => !used[x] || x === cur);
  const v = await modal({title: `Máy ${n}`, ok: 'Lưu',
    html: `<label class="switch"><input type="checkbox" id="seatBad" ${isBad ? 'checked' : ''}><span class="tr"></span><span>Máy hỏng</span></label>
      <div style="margin-top:14px"><div class="muted" style="margin-bottom:4px">Học sinh ngồi máy này</div>
      <select id="seatSel" style="width:100%"><option value="__none__">— Bỏ trống —</option>${free.map(x => `<option ${x === cur ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
      <div class="muted" style="margin:10px 0 4px">Hoặc ghi tên bạn ngoài danh sách lớp</div>
      <input type="text" id="seatOther" style="width:100%" value="${cur && !inList ? esc(cur) : ''}" placeholder="Ví dụ: bạn lớp khác ngồi nhờ"></div>
      <p class="hint">Danh sách chỉ hiện học sinh chưa có chỗ${cur && inList ? ' và em đang ngồi máy này' : ''}. Máy hỏng thì không có người ngồi.</p>`,
    collect: r => ({bad: r.querySelector('#seatBad').checked, sel: r.querySelector('#seatSel').value, other: r.querySelector('#seatOther').value.trim()})});
  if (!v) return;
  const broken = new Set(lay.broken || []);
  if (v.bad) { broken.add(n); delete seats[n]; }
  else {
    broken.delete(n);
    if (v.other) seats[n] = v.other; else if (v.sel !== '__none__') seats[n] = v.sel; else delete seats[n];
  }
  await seatSave({seats, broken: [...broken]});
}

function seatInit(name) {
  const w = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!w.length) return '＋';
  return (w.length > 1 ? w[0][0] + w[w.length - 1][0] : w[0].slice(0, 2)).toUpperCase();
}

function viewSeats() {
  const sc = S.school, cls = (sc.classes || []);
  if (!cls.length) return '';
  if (!S.seatCls || !cls.some(c => c.name === S.seatCls)) S.seatCls = (sc.current && cls.some(c => c.name === sc.current.cls)) ? sc.current.cls : cls[0].name;
  const lay = curLay(), num = seatNumbers(lay), cnt = (cls.find(c => c.name === S.seatCls) || {}).count || 0;
  const by = lay.seats, inCls = new Set(S.stu[S.seatCls] || []), filled = Object.values(by).filter(v => !inCls.size || inCls.has(v)).length;
  const bad = new Set(lay.broken || []);
  const att = (S.att && S.att.cls === S.seatCls) ? S.att : null, eff = att ? att.seats : by, off = new Set(att ? att.offline : []);
  const shareAt = {}; if (att) Object.entries(att.shares || {}).forEach(([n, m]) => { (shareAt[m] = shareAt[m] || []).push(n); });
  const dayNo = c => lay.first === 'left' ? c + 1 : lay.cols - c;
  const head = num[0].map((_, c) => `<div class="dayhead">Dãy ${dayNo(c)}</div>`).join('');
  const cells = num.map(row => row.map(n => {

    const mates = shareAt[n] || [];
    const cl = isBad ? 'bad' : moved ? 'moved' : gone ? 'absent' : guest ? 'guest' : shown ? 'full' : 'empty';
    const nm = isBad ? 'Máy hỏng' : gone ? by[n] : shown || 'Trống';
    const av = isBad ? '✕' : gone ? seatInit(by[n]) : shown ? seatInit(shown) : '＋';
    const tag = isBad ? '' : gone ? '<em class="tg">vắng</em>' : mates.length ? `<em class="tg">+${mates.length} chung</em>` : moved ? '<em class="tg">mới</em>' : '';
    const tip = isBad ? 'Máy hỏng' : gone ? 'Vắng: ' + by[n] : moved ? shown + ' (được chuyển đến)' : (shown || 'Chưa xếp') + (mates.length ? ' · ngồi chung với ' + mates.join(', ') : '') + (off.has(n) ? ' · máy đang tắt' : '');
    return `<button class="seat ${cl} ${mates.length ? 'shared' : ''} ${off.has(n) && !isBad ? 'off' : ''}" data-act="seatpick" data-n="${n}" title="${esc(tip)}"><i class="sn">${n}</i>${tag}<span class="av">${esc(av)}</span><span class="nm">${esc(nm)}</span></button>`; }).join('')).join('');

      <label>Đánh số từ<select data-lay="from">${opt('teacher', lay.from, 'Bàn giáo viên (đầu dãy)')}${opt('door', lay.from, 'Cửa ra vào (cuối dãy)')}</select></label>
      <label>Dãy số 1 ở bên<select data-lay="first">${opt('left', lay.first, 'Trái')}${opt('right', lay.first, 'Phải')}</select></label>
      <label>Tên máy mẫu<input type="text" data-lay="pattern" value="${esc(lay.pattern)}" placeholder="MAY{n}"></label>
      <label>Bàn giáo viên<select data-lay="gv">${opt('left', lay.gv, 'Góc trái')}${opt('center', lay.gv, 'Giữa')}${opt('right', lay.gv, 'Góc phải')}</select></label>
      <label>Cửa ra vào<select data-lay="door">${opt('back', lay.door, 'Cuối lớp')}${opt('tl', lay.door, 'Trên cùng, bên trái')}${opt('tr', lay.door, 'Trên cùng, bên phải')}</select></label>
      <label>&nbsp;<button class="btn ghost sm" data-act="seatall" title="Chép số dãy, số máy và cách đánh số sang tất cả các lớp">Áp dụng kiểu phòng cho mọi lớp</button></label>
      <p class="hint" style="grid-column:1/-1;margin:0">Số máy tăng dần dọc theo từng dãy, ${lay.from === 'teacher' ? 'bắt đầu từ máy gần bàn giáo viên' : 'bắt đầu từ máy gần cửa'}, dãy số 1 ở bên ${lay.first === 'left' ? 'trái' : 'phải'} (nhìn từ bàn giáo viên xuống lớp). Số máy đổi thành tên máy bằng <b>Tên máy mẫu</b> (ví dụ <code>MAY{n}</code> khớp MAY1, MAY01, MAY12); để trống thì theo thứ tự danh sách máy ở trang Điều khiển lớp.</p></div>` : '';
  const lg = (bg, bd, t) => `<span><i style="background:${bg};border-color:${bd}"></i>${t}</span>`;

    <div class="sstats" style="margin-bottom:12px"><span class="sstat"><b>${filled}/${cnt}</b> học sinh đã có chỗ</span><span class="sstat"><b>${lay.cols * lay.per - bad.size}</b> máy dùng được</span>${bad.size ? `<span class="sstat" style="background:#fdecec;color:#b91c1c"><b>${bad.size}</b> máy hỏng</span>` : ''}${att && att.absent.length ? `<span class="sstat"><b>${att.absent.length}</b> vắng hôm nay</span>` : ''}<span class="muted" style="font-size:12.5px">Bấm vào một máy để xếp chỗ hoặc báo máy hỏng</span></div>

function viewSchool() {

  const total = cls.reduce((a, c) => a + c.count, 0);
  const todayIdx = (new Date().getDay() + 6) % 7;
  const nowTxt = cur
    ? `<div style="font-size:30px;font-weight:800">Lớp ${esc(cur.cls)}</div><div class="muted">${sc.source === 'manual' ? 'Do bạn đặt tay' + (cur.until ? ' (hết hiệu lực lúc ' + new Date(cur.until * 1000).toTimeString().slice(0, 5) + ')' : '') : `Tiết ${esc(cur.start)} – ${esc(cur.end)}`}</div>`

  const nextTxt = nxt

        return s ? `<td class="${on ? 'on' : ''}">${esc(s.cls)}</td>` : '<td class="nil"></td>'; }).join('')}</tr>`; }).join('')}</table>`

  const chips = cls.length ? `<div class="cchips">${cls.map(c => `<span class="cchip ${cur && cur.cls === c.name ? 'on' : ''}" data-act="schoolset" data-cls="${esc(c.name)}" title="Bấm để đặt làm lớp hiện tại">${esc(c.name)}<small>${c.count} HS</small></span>`).join('')}</div>`
    : '<div class="empty">Chưa có danh sách lớp. Bấm “Nhập danh sách lớp” và chọn file Excel điểm danh.</div>';
  const info = (f, at) => f ? `<span class="muted">${esc(f)} · nhập lúc ${esc(at)}</span>` : '<span class="muted">Chưa nhập</span>';
  return `<div class="stack">
    <section class="card"><div style="display:grid;grid-template-columns:1fr 1fr;gap:22px">
      <div><div class="muted" style="margin-bottom:6px">ĐANG DẠY</div>${nowTxt}</div>
      <div><div class="muted" style="margin-bottom:6px">LỚP KẾ TIẾP</div>${nextTxt}</div></div>
      <div class="row" style="margin-top:16px;gap:22px">
        <label class="switch"><input type="checkbox" data-schoolauto ${sc.auto !== false ? 'checked' : ''}><span class="tr"></span><span>Tự chuyển lớp theo thời khóa biểu</span></label>
        ${(sc.source === 'manual') ? '<button class="btn" data-act="schoolclear">↩ Quay lại theo lịch</button>' : ''}
      </div>
      <p class="hint" style="margin-bottom:0">Tên lớp hiện tại hiện ở góc trên bên phải và được ghi vào từng vi phạm (lọc được ở trang Vi phạm). Lịch đổi đột xuất thì bấm tên một lớp ở dưới để đặt làm lớp hiện tại${sc.auto === false ? '' : ' (có hiệu lực 45 phút rồi tự quay lại theo lịch)'}.</p>
    </section>
    <section class="card"><div class="toolbar" style="margin-bottom:10px"><b>Nhập dữ liệu</b><span class="grow"></span></div>
      <div class="row" style="gap:12px;flex-wrap:wrap">
        <button class="btn primary" data-act="schoolimport" data-kind="classes">📥 Nhập danh sách lớp</button>${info(sc.classes_file, sc.classes_at)}
        <input type="file" id="schoolFile_classes" data-schoolfile="classes" accept=".xlsx,.xlsm" class="hidden">

        <button class="btn primary" data-act="schoolimport" data-kind="timetable">📥 Nhập thời khóa biểu</button>${info(sc.timetable_file, sc.timetable_at)}
        <input type="file" id="schoolFile_timetable" data-schoolfile="timetable" accept=".xlsx,.xlsm" class="hidden">
      </div>
      <p class="hint" style="margin-bottom:0">Danh sách lớp: file điểm danh của trường (mỗi lớp một sheet, tên lớp ở ô E2, họ tên ở cột C). Thời khóa biểu: bảng tiết × thứ, ô ghi tên lớp. File chỉ được đọc để lấy dữ liệu, không gửi xuống máy học sinh. Nhập lại bất cứ lúc nào để cập nhật.</p>
      ${(sc.unknown || []).length ? `<div class="note warn" style="margin-top:10px">Lớp có trong thời khóa biểu nhưng không có trong danh sách lớp: <b>${sc.unknown.map(esc).join(', ')}</b></div>` : ''}
    </section>
    <section class="card"><div class="toolbar" style="margin-bottom:10px"><b>Thời khóa biểu</b>${sc.subject || sc.teacher ? `<span class="muted">${esc([sc.subject, sc.teacher].filter(Boolean).join(' · '))}${sc.from ? ' · từ ' + esc(sc.from.split('-').reverse().join('/')) : ''}</span>` : ''}</div>${grid}</section>
    ${viewSeats()}
    <section class="card"><div class="toolbar" style="margin-bottom:10px"><b>Các lớp</b><span class="muted">${cls.length} lớp · ${total} học sinh</span><span class="grow"></span></div>${chips}
      ${cls.length ? `<div class="row" style="margin-top:12px;gap:8px;flex-wrap:wrap"><span class="muted">Xem danh sách học sinh:</span>${cls.map(c => `<button class="btn ghost sm" data-act="schoolstudents" data-cls="${esc(c.name)}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    </section></div>`;
}

async function loadReport() { S.report = await api('/api/report?range=' + encodeURIComponent(S.reportRange)); }

function viewReport() {
  const r = S.report;
  const ranges = {'2h': 'Hai giờ qua', today: 'Hôm nay', '7d': '7 ngày qua', all: 'Tất cả'};
  const head = `<section class="card"><div class="toolbar" style="margin-bottom:0">
      <select id="reportRange">${Object.entries(ranges).map(([k, v]) => `<option value="${k}" ${S.reportRange === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
      <button class="btn" data-act="reportreload">↻ Làm mới</button><span class="grow"></span>
      <button class="btn primary" data-act="reportexport">📊 Xuất Excel</button>
      <button class="btn ghost" data-act="openreports">Mở thư mục báo cáo</button></div>
      <p class="hint" style="margin:12px 0 0">Một “lần vi phạm” là các ảnh liên tiếp của cùng một máy và cùng một trang/ứng dụng (cách nhau dưới ${r ? r.gap : 60} giây), nên học sinh ở yên một trang chỉ tính một lần.</p></section>`;
  if (!r || !r.episodes) return `<div class="stack">${head}<div class="empty">Chưa có vi phạm trong khoảng “${esc(ranges[S.reportRange])}”.</div></div>`;
  const maxH = Math.max(...r.by_host.map(h => h.count)), maxI = Math.max(...r.by_item.map(i => i.count)), maxHr = Math.max(...r.by_hour.map(h => h.count));
  const top = r.by_item[0], worst = r.by_host[0], peak = r.by_hour.reduce((a, b) => b.count > a.count ? b : a);
  const tagOf = t => `<span class="tag ${esc(t)}">${t === 'site' ? 'Trang web' : 'Ứng dụng'}</span>`;
  const hostRows = r.by_host.map(h => `<tr><td><b>${esc(h.host)}</b></td><td class="barcell"><div class="bar" style="width:${Math.round(h.count / maxH * 100)}%"></div></td><td><b>${h.count}</b> lần <span class="muted">(${h.shots} ảnh)</span></td><td class="muted">${h.top.map(t => esc(t.name) + ' ×' + t.count).join(', ')}</td></tr>`).join('');
  const itemRows = r.by_item.map(i => `<tr><td><b>${esc(i.name)}</b> ${tagOf(i.type)}</td><td class="barcell"><div class="bar" style="width:${Math.round(i.count / maxI * 100)}%"></div></td><td><b>${i.count}</b> lần · ${i.hosts} máy</td><td class="act"><button class="btn" data-act="allowadd" data-type="${esc(i.type)}" data-name="${esc(i.name)}" title="Thêm vào ${i.type === 'site' ? 'danh sách trang web' : 'danh sách ứng dụng'} được phép">＋ Cho phép</button></td></tr>`).join('');
  const sug = r.suggest.length ? `<div class="note warn" style="margin:0">Các trang này có từ 3 máy trở lên cùng vào: <b>${r.suggest.map(esc).join(', ')}</b>. Có thể là trang cần cho bài học, hãy cân nhắc bấm “＋ Cho phép”. Nếu không thì nhắc nhở cả lớp.</div>` : '';
  return `<div class="stack">${head}
    <div class="stats">
      <div class="stat"><div class="n">${r.episodes}</div><div class="l">lần vi phạm (${r.shots} ảnh)</div></div>
      <div class="stat"><div class="n">${r.machines}</div><div class="l">máy có vi phạm</div></div>
      <div class="stat"><div class="n" style="font-size:20px">${esc(worst.host)}</div><div class="l">vi phạm nhiều nhất: ${worst.count} lần</div></div>
      <div class="stat"><div class="n" style="font-size:20px;word-break:break-all">${esc(top.name)}</div><div class="l">bị vào nhiều nhất: ${top.count} lần, ${top.hosts} máy</div></div>
      <div class="stat"><div class="n">${esc(peak.hour)}h</div><div class="l">giờ cao điểm (${peak.count} lần)</div></div>
    </div>
    ${sug}
    <section class="card"><h3>Theo máy</h3><table class="tbl"><thead><tr><th>Máy</th><th></th><th>Số lần</th><th>Hay vào</th></tr></thead><tbody>${hostRows}</tbody></table></section>
    <section class="card"><h3>Theo trang web / ứng dụng</h3><table class="tbl"><thead><tr><th>Nội dung</th><th></th><th>Số lần</th><th></th></tr></thead><tbody>${itemRows}</tbody></table>
      <p class="hint" style="margin-bottom:0">“＋ Cho phép” chỉ thêm dòng vào danh sách. Hãy mở trang “Trang web được phép” hoặc “Ứng dụng được phép” rồi bấm Lưu để áp dụng.</p></section>
    <section class="card"><h3>Theo giờ</h3><div class="hours">${r.by_hour.map(h => `<div><i style="height:${Math.round(h.count / maxHr * 70)}px" title="${h.count} lần"></i>${esc(h.hour)}h</div>`).join('')}</div></section>
  </div>`;
}

function lightbox(e) {
  const el = document.createElement('div');
  el.className = 'lightbox';
  el.innerHTML = `<img src="${imgUrl(e)}" alt=""><div class="cap"><b>${esc(e.host)}</b> · ${esc(e.text)}<br>${esc(e.date)} ${esc(e.time)}${e.user ? ' · ' + esc(e.user) : ''}${e.window ? '<br>' + esc(e.window) : ''}</div>`;
  const close = () => { el.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = ev => { if (ev.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  el.onclick = close;
  document.body.appendChild(el);
}

/* ---------- điều hướng và vẽ lại ---------- */
function buildNav() {
  $('#nav').innerHTML = PAGES.map(p => p.grp ? `<div class="grp">${p.grp}</div>`
    : `<button data-page="${p.id}" class="${S.page === p.id ? 'on' : ''}${p.id === 'viol' && S.unseen ? ' alerting' : ''}"><span class="ic">${p.ic}</span><span class="tx">${esc(p.name)}</span>${p.id === 'viol' && S.unseen ? `<span class="nbadge">${S.unseen > 99 ? '99+' : S.unseen}</span>` : ''}</button>`).join('');
}

async function go(id) {
  S.page = id;
  if (id === 'viol') { S.unseen = 0; S.freshFrom = S.seenSeq || 0; S.seenSeq = S.alertSeq; }
  const p = PAGES.find(x => x.id === id);
  try {
    if (p.list && !S.lists[p.list]) await loadList(p.list);
    if (id === 'dist') await loadPayload();
    if (id === 'setup') await loadSetup();
    if (id === 'vcfg') await loadVcfg();
    if (id === 'report') await loadReport();
    if (id === 'school') await loadSchool();
  } catch (e) { toast(e.message, 'err'); }
  buildNav(); render(true);
}

function render(top) {
  const main = $('#main'), keep = main.scrollTop;
  const p = PAGES.find(x => x.id === S.page);
  const m = p.list ? S.st.lists[p.list] : null;
  $('#title').textContent = m ? m.title : p.title;
  $('#sub').textContent = m ? 'Sửa nội dung file Excel bằng giao diện, không cần mở Excel.' : p.sub;
  const v = $('#view');
  if (S.page === 'setup') v.innerHTML = viewSetup();
  else if (S.page === 'control') v.innerHTML = viewControl();
  else if (S.page === 'dist') v.innerHTML = viewDist();
  else if (S.page === 'vcfg') v.innerHTML = viewVcfg();
  else if (S.page === 'viol') v.innerHTML = viewViol();
  else if (S.page === 'school') v.innerHTML = viewSchool();
  else if (S.page === 'report') v.innerHTML = viewReport();
  else if (S.page === 'settings') v.innerHTML = viewSettings();
  else v.innerHTML = viewList(p.list);
  if (p.list) applyFilter(p.list);
  main.scrollTop = top ? 0 : keep;
  const st = S.st;
  updWatchInfo(); updClassBadge(); showUpdate(); $('#verTxt').textContent = 'Quản lý lớp học · v' + st.version;
  $('#statusDot').className = 'dot ' + (st.veyon_cli_found ? 'ok' : 'bad');
  $('#statusTxt').textContent = st.veyon_cli_found ? 'Đã tìm thấy veyon-cli' : 'Chưa thấy veyon-cli';
  $('#status').title = st.veyon_cli_path + (st.veyon_cli_found ? '' : ' (không tồn tại, bấm để mở Cài đặt)');
}
